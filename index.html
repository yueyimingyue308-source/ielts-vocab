<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思词汇真经 · 背词工作台</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#2d3436; --muted:#7f8c8d;
  --accent:#e17055; --accent2:#0984e3; --ok:#00b894; --bad:#d63031;
  --border:#e0e3ea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(135deg,#2d3436,#636e72);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:700}
header .sub{font-size:12px;opacity:.75;margin-top:2px}
.tabs{margin-left:auto;display:flex;gap:8px}
.tabs button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px}
.tabs button.active{background:#fff;color:#2d3436;font-weight:600}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px}
/* 学习模式布局 */
.learn{display:grid;grid-template-columns:240px 1fr;gap:20px}
@media(max-width:800px){.learn{grid-template-columns:1fr}}
.chapter-list{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;max-height:70vh;overflow:auto}
.chapter-list .ch{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}
.chapter-list .ch:hover{background:#f0f1f5}
.chapter-list .ch.active{background:var(--accent);color:#fff}
.chapter-list .ch .n{font-size:11px;opacity:.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;position:relative;min-height:420px}
.card .pos{position:absolute;top:14px;right:18px;font-size:12px;color:var(--muted)}
.word{font-size:40px;font-weight:800;letter-spacing:.5px}
.word small{font-size:14px;font-weight:400;color:var(--muted);margin-left:10px}
.phon{font-size:16px;color:var(--accent2);margin-top:6px}
.meaning{font-size:22px;color:var(--accent);margin-top:18px;line-height:1.6}
.notes{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.note{background:#f8f9fb;border-left:3px solid var(--accent2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7}
.note .tag{font-weight:700;color:var(--accent2);margin-right:8px}
.note.ex{border-left-color:#00b894}
.note.ex .tag{color:#00b894}
.note.co{border-left-color:#fdcb6e}
.note.co .tag{color:#d08a00}
.note.mn{border-left-color:#a29bfe}
.note.mn .tag{color:#6c5ce7}
.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.actions button{border:none;border-radius:10px;padding:12px 20px;font-size:15px;cursor:pointer;font-weight:600;transition:.15s}
.actions button:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-prev,.btn-next{background:#edf1f5;color:var(--ink)}
.btn-sound{background:var(--accent2);color:#fff}
.btn-sound.alt{background:#a29bfe}
.btn-master{background:var(--ok);color:#fff}
.btn-flag{background:#fdcb6e;color:#5a3e00}
.progress{position:absolute;bottom:16px;right:20px;font-size:12px;color:var(--muted)}
/* 检测模式 */
.quiz{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:760px;margin:0 auto}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.quiz-score{font-size:14px;color:var(--muted)}
.quiz-q{font-size:26px;font-weight:700;text-align:center;margin:20px 0}
.quiz-q .sub{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:8px}
.options{display:grid;grid-template-columns:1fr;gap:10px;margin:20px 0}
.options button{background:#f8f9fb;border:2px solid var(--border);border-radius:10px;padding:14px 18px;font-size:16px;text-align:left;cursor:pointer;transition:.15s}
.options button:hover:not(:disabled){border-color:var(--accent2);background:#edf3fd}
.options button.correct{border-color:var(--ok);background:#e6faf3}
.options button.wrong{border-color:var(--bad);background:#fdeeee}
.options button:disabled{cursor:default}
.quiz-actions{display:flex;justify-content:center;gap:12px;margin-top:16px}
.quiz-actions button{border:none;border-radius:10px;padding:12px 26px;font-size:15px;cursor:pointer;font-weight:600}
.btn-check{background:var(--accent2);color:#fff}
.btn-nextq{background:var(--accent);color:#fff}
.btn-restart{background:#edf1f5;color:var(--ink)}
.quiz-type{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.quiz-type button{border:1px solid var(--border);background:#fff;border-radius:20px;padding:7px 16px;font-size:13px;cursor:pointer}
.quiz-type button.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.feedback{text-align:center;font-size:15px;min-height:24px;margin-top:6px;font-weight:600}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
/* 结果 */
.result{text-align:center;padding:30px 0}
.result .big{font-size:56px;font-weight:800;color:var(--accent)}
.result .detail{color:var(--muted);margin:12px 0 24px;font-size:15px}
/* 词表抽屉 */
.wordlist{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:16px;max-height:300px;overflow:auto}
.wordlist .w{display:inline-block;padding:5px 10px;margin:3px;border-radius:6px;background:#f0f1f5;font-size:13px;cursor:pointer}
.wordlist .w.done{background:#e6faf3;color:var(--ok)}
.wordlist .w.flag{background:#fef5e0;color:#8a6d00}
.legend{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.hidden{display:none!important}
.badge{display:inline-block;background:#ffeaa7;color:#5a3e00;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>📖 雅思词汇真经 · 背词工作台</h1>
    <div class="sub">刘洪波 · 22 章 · 3692 词 · 注释 + 发音 + 检测</div>
  </div>
  <div class="tabs">
    <button id="tab-learn" class="active" onclick="showTab('learn')">📚 学习</button>
    <button id="tab-quiz" onclick="showTab('quiz')">✏️ 检测</button>
  </div>
</header>

<div class="wrap">
  <!-- ============ 学习模式 ============ -->
  <div id="view-learn" class="learn">
    <aside class="chapter-list" id="chapterList"></aside>

      <span class="pos" id="pos"></span>
      <div class="word" id="word"></div>

      <div class="notes" id="notes"></div>

        <button class="btn-prev" onclick="step(-1)">← 上一个</button>

        <button class="btn-sound alt" onclick="playSound('us')">🇺🇸 美音</button>
        <button class="btn-master" onclick="toggleMaster()" id="btnMaster">✔ 已掌握</button>
        <button class="btn-flag" onclick="toggleFlag()" id="btnFlag">⭐ 收藏</button>
        <button class="btn-prev" onclick="randomWord()">🎲 随机</button>
      </div>
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <!-- ============ 检测模式 ============ -->
  <div id="view-quiz" class="quiz hidden">
    <div class="quiz-type" id="quizType">
      <button class="active" data-t="meaning">看词选义</button>
      <button data-t="word">看义选词</button>
      <button data-t="spell">拼写测试</button>
      <button data-t="listen">听音拼写</button>
    </div>
    <div class="quiz-head">
      <div id="quizInfo">第 1 / 20 题</div>
      <div class="quiz-score" id="quizScore">正确 0 · 错误 0</div>
    </div>
    <div id="quizBody"></div>
    <div class="quiz-actions">
      <button class="btn-restart" onclick="startQuiz()">🔄 重新开始</button>
    </div>
    <div class="legend">检测范围：当前章节全部单词，随机抽 20 题</div>
  </div>
</div>

<script>
// ===== 状态 =====
const state = {
  chapter: 0,
  idx: 0,
  mode: 'learn',
  quizType: 'meaning',
  quiz: [],
  qi: 0,
  correct: 0,
  wrong: 0,
  answered: false,
  master: {},   // 已掌握
  flags: {},    // 收藏
  loaded: {}    // 已加载的章节
};
try{
  state.master = JSON.parse(localStorage.getItem('wz_master')||'{}');
  state.flags = JSON.parse(localStorage.getItem('wz_flags')||'{}');
}catch(e){}

function save(){
  localStorage.setItem('wz_master', JSON.stringify(state.master));
  localStorage.setItem('wz_flags', JSON.stringify(state.flags));
}
const CHAPTERS = [];
const cur = () => (state.loaded[state.chapter+1] || {}).w || [];

// ===== 数据已内嵌，直接加载 =====
window.CHAPTER_DATA = CHAPTER_DATA;
function loadChapter(n, cb){
  if(state.loaded[n]){ if(cb) cb(); return; }
  state.loaded[n] = CHAPTER_DATA[n-1];
  if(cb) cb();
}

// ===== 章节列表 =====
function renderChapters(){
  const el = document.getElementById('chapterList');
  el.innerHTML = '';
  BOOK_META.forEach((m,i)=>{
    const div = document.createElement('div');
    div.className = 'ch' + (i===state.chapter?' active':'');
    div.innerHTML = `<span>${m.t}</span><span class="n">${m.count}词</span>`;
    div.onclick = ()=>{
      state.chapter = i;
      state.idx = 0;
      renderChapters();
      loadChapter(i+1, render);
    };
    el.appendChild(div);
  });
}

// ===== 渲染单词卡片 =====
function render(){
  const w = cur()[state.idx];
  if(!w){ return; }
  document.getElementById('pos').textContent = `${state.chapter+1}/${BOOK_META.length}章`;
  document.getElementById('word').innerHTML = escapeHtml(w.w);
  // 音标（已内嵌）
  const phon = document.getElementById('phon');
  if(w.ph) phon.innerHTML = `英 /${w.ph}/` + (w.phus ? `　美 /${w.phus}/` : '');
  else phon.textContent = '';
  document.getElementById('meaning').textContent = w.m || '';
  // 注释
  const notes = document.getElementById('notes');
  notes.innerHTML = '';
  if(w.ex) notes.appendChild(noteEl('例', w.ex, 'ex'));
  if(w.co) notes.appendChild(noteEl('搭', w.co, 'co'));
  if(w.mn) notes.appendChild(noteEl('记', w.mn, 'mn'));
  // 按钮状态
  const key = BOOK_META[state.chapter].t + '|' + w.w;
  document.getElementById('btnMaster').textContent = state.master[key] ? '✔ 已掌握 ✓' : '✔ 标记掌握';
  document.getElementById('btnFlag').textContent = state.flags[key] ? '⭐ 已收藏' : '⭐ 收藏';
  document.getElementById('progress').textContent = `${state.idx+1} / ${cur().length}`;
}
function noteEl(tag, txt, cls){
  const d = document.createElement('div');
  d.className = 'note ' + cls;
  d.innerHTML = `<span class="tag">${tag}</span>${escapeHtml(txt)}`;
  return d;
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function step(d){
  const len = cur().length;
  state.idx = (state.idx + d + len) % len;
  render();
}
function randomWord(){
  const len = cur().length;
  state.idx = Math.floor(Math.random()*len);
  render();
}
function toggleMaster(){
  const w = cur()[state.idx];
  if(!w) return;
  const key = BOOK_META[state.chapter].t + '|' + w.w;
  if(state.master[key]) delete state.master[key]; else state.master[key]=1;
  save(); render();
}
function toggleFlag(){
  const w = cur()[state.idx];
  if(!w) return;
  const key = BOOK_META[state.chapter].t + '|' + w.w;
  if(state.flags[key]) delete state.flags[key]; else state.flags[key]=1;
  save(); render();
}

// ===== 发音 =====
function playSound(accent){
  const w = cur()[state.idx].w;
  const type = (accent==='us') ? 2 : 1;
  const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(w) + '&type=' + type);
  a.play().catch(()=>{
    // 兜底：浏览器 TTS
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(w);
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    }
  });
}
// 音标已内嵌数据，无需在线获取

// ===== Tab 切换 =====
function showTab(t){
  state.mode = t;
  document.getElementById('tab-learn').classList.toggle('active', t==='learn');
  document.getElementById('tab-quiz').classList.toggle('active', t==='quiz');
  document.getElementById('view-learn').classList.toggle('hidden', t!=='learn');
  document.getElementById('view-quiz').classList.toggle('hidden', t!=='quiz');
  if(t==='quiz') startQuiz();
}

// ===== 检测 =====
function startQuiz(){
  const pool = cur();
  if(!pool.length) return;
  // 随机抽 20 题
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  state.quiz = shuffled.slice(0, Math.min(20, pool.length));
  state.qi = 0; state.correct = 0; state.wrong = 0; state.answered = false;
  renderQuiz();
}
function renderQuiz(){
  const body = document.getElementById('quizBody');
  document.getElementById('quizInfo').textContent = `第 ${state.qi+1} / ${state.quiz.length} 题 (${BOOK_META[state.chapter].t})`;
  document.getElementById('quizScore').textContent = `正确 ${state.correct} · 错误 ${state.wrong}`;
  const q = state.quiz[state.qi];
  if(!q){ // 完成
    body.innerHTML = `
      <div class="result">
        <div class="big">${Math.round(state.correct/state.quiz.length*100)}%</div>
        <div class="detail">共 ${state.quiz.length} 题 · 正确 ${state.correct} · 错误 ${state.wrong}</div>
        <button class="btn-nextq" onclick="startQuiz()">🔄 再来一轮</button>
      </div>`;
    return;
  }
  const type = state.quizType;
  if(type === 'meaning'){
    // 看词选义
    const opts = pickOptions(q.w);
    const optIdx = Math.floor(Math.random()*4);
    opts.splice(optIdx, 0, q.m);
    body.innerHTML = `
      <div class="quiz-q">${escapeHtml(q.w)}<span class="sub">选择正确的释义</span></div>
      <div class="options">${opts.map((o,i)=>`<button data-i="${i}" onclick="answer(${i},'${optIdx}')">${escapeHtml(o)}</button>`).join('')}</div>
      <div class="feedback"></div>`;
  } else if(type === 'word'){
    // 看义选词
    const opts = pickWords(q.w);
    const optIdx = Math.floor(Math.random()*4);
    opts.splice(optIdx, 0, q.w);
    body.innerHTML = `
      <div class="quiz-q">${escapeHtml(q.m||q.w)}<span class="sub">选择对应的单词</span></div>
      <div class="options">${opts.map((o,i)=>`<button data-i="${i}" onclick="answer(${i},'${optIdx}')">${escapeHtml(o)}</button>`).join('')}</div>
      <div class="feedback"></div>`;
  } else if(type === 'spell'){
    // 看义拼词
    body.innerHTML = `
      <div class="quiz-q">${escapeHtml(q.m||q.w)}<span class="sub">输入对应的英文单词</span></div>
      <input id="spellInput" style="width:100%;padding:14px;font-size:20px;border:2px solid var(--border);border-radius:10px;margin:10px 0;text-align:center" placeholder="输入单词后回车">
      <div class="feedback"></div>
      <div style="text-align:center;margin-top:10px"><button class="btn-check" onclick="checkSpell()">检查</button></div>`;
    document.getElementById('spellInput').focus();
    document.getElementById('spellInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkSpell(); });
  } else if(type === 'listen'){
    // 听音拼词
    new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(q.w) + '&type=1').play();
    body.innerHTML = `
      <div class="quiz-q">🔊 ${escapeHtml(q.w)}<span class="sub">听发音后输入单词（可点上方单词重听）</span></div>
      <input id="spellInput" style="width:100%;padding:14px;font-size:20px;border:2px solid var(--border);border-radius:10px;margin:10px 0;text-align:center" placeholder="输入单词后回车">
      <div class="feedback"></div>
      <div style="text-align:center;margin-top:10px"><button class="btn-check" onclick="checkSpell()">检查</button></div>`;
    document.getElementById('spellInput').focus();
    document.getElementById('spellInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkSpell(); });
  }
}
// 选干扰项（释义）
function pickOptions(word){
  const pool = cur();
  const others = pool.filter(w=>w.w!==word && w.m).map(w=>w.m);
  const picks = [];
  while(picks.length<3 && others.length){
    const o = others.splice(Math.floor(Math.random()*others.length),1)[0];
    if(!picks.includes(o)) picks.push(o);
  }
  return picks;
}
// 选干扰项（单词）
function pickWords(word){
  const pool = cur();
  const others = pool.filter(w=>w.w!==word).map(w=>w.w);
  const picks = [];
  while(picks.length<3 && others.length){
    const o = others.splice(Math.floor(Math.random()*others.length),1)[0];
    if(!picks.includes(o)) picks.push(o);
  }
  return picks;
}
function answer(i, correctIdx){
  if(state.answered) { next(); return; }
  state.answered = true;
  const correct = String(i) === String(correctIdx);
  if(correct) state.correct++; else state.wrong++;
  const btns = document.querySelectorAll('.options button');
  btns.forEach((b,bi)=>{
    b.disabled = true;
    if(String(bi)===String(correctIdx)) b.classList.add('correct');
    if(String(bi)===String(i) && !correct) b.classList.add('wrong');
  });
  const fb = document.querySelector('.feedback');
  fb.textContent = correct ? '✅ 正确！' : '❌ 错误';
  fb.className = 'feedback ' + (correct?'ok':'bad');
  document.getElementById('quizScore').textContent = `正确 ${state.correct} · 错误 ${state.wrong}`;
  // 自动下一步
  setTimeout(next, 900);
}
function checkSpell(){
  const q = state.quiz[state.qi];
  const input = document.getElementById('spellInput');
  const val = (input.value||'').trim().toLowerCase();
  const ans = q.w.toLowerCase();
  const fb = document.querySelector('.feedback');
  if(!val){ fb.textContent='请输入单词'; return; }
  if(state.answered){ next(); return; }
  state.answered = true;
  const correct = val === ans;
  if(correct) state.correct++; else state.wrong++;
  fb.textContent = correct ? `✅ 正确！${q.w}` : `❌ 错误，正确答案：${q.w}`;
  fb.className = 'feedback ' + (correct?'ok':'bad');
  document.getElementById('quizScore').textContent = `正确 ${state.correct} · 错误 ${state.wrong}`;
  setTimeout(next, 1200);
}
function next(){
  state.answered = false;
  state.qi++;
  renderQuiz();
}

// ===== 检测模式切换 =====
document.querySelectorAll('#quizType button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('#quizType button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.quizType = btn.dataset.t;
    startQuiz();
  };
});

// ===== 初始化 =====
renderChapters();
loadChapter(1, render);
</script>
</body>
</html>
